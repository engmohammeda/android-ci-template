name: Android · CI · Release · Store · Telegram · Pages · Play

# ════════════════════════════════════════════════════════════════════
# خريطة التشغيل:
#   • push إلى main/master أو وسم v*        → Release كامل (بناء+فحوصات+نشر+إرسال)
#   • Pull Request                          → CI فقط (tests+lint+debug APK)
#   • workflow_dispatch                     → تحكم يدوي بمفاتيح (tests/telegram/pages/play)
#   • schedule أسبوعي (اثنين 03:00 UTC)     → بناء bitrot يكشف تقادم main مبكراً
# ════════════════════════════════════════════════════════════════════
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "تشغيل بوابة الاختبارات والـ lint"
        type: boolean
        default: true
      send_telegram:
        description: "إرسال الملاحظات والملفات إلى تلجرام (يتطلب السرّين)"
        type: boolean
        default: true
      deploy_pages:
        description: "نشر صفحة الخصوصية/الوصف على GitHub Pages"
        type: boolean
        default: true
      publish_play:
        description: "رفع AAB إلى مسار internal في Google Play (يتطلب سرّ حساب الخدمة)"
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write          # وسوم + Releases + دفع
  pages: write             # نشر Pages
  id-token: write          # مطلوب لـ Pages
  pull-requests: write     # تعليقات PR إن أضفتها لاحقاً

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
  APP_NAME: ${{ github.event.repository.name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ═══════════════════════════ CI (PR + الفروع) ═══════════════════════════
  ci:
    name: CI · tests + lint + debug
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components (platform 36 + build-tools 36)
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Restore Gradle Wrapper jar if missing
        run: |
          set -e
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sSL -o /tmp/gradle-dist.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
            unzip -q /tmp/gradle-dist.zip -d /tmp
            /tmp/gradle-8.11.1/bin/gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon
          fi
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: google-services.json — اختياري (يتفعّل فقط عند تبنّي Firebase)
        env:
          GSC: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if grep -q "com.google.gms.google-services" app/build.gradle.kts; then
            if [ -n "$GSC" ]; then
              case "$GSC" in
                '{'*) printf '%s' "$GSC" > app/google-services.json ;;
                *)    printf '%s' "$GSC" | base64 -d > app/google-services.json ;;
              esac
            elif [ -f app/google-services.json ] && grep -q "project_number" app/google-services.json && ! grep -q "REPLACE_WITH" app/google-services.json; then
              echo "استخدم app/google-services.json المودع"
            else
              echo "::error::المشروع تبنّى Firebase ولا يوجد google-services صالح"; exit 1
            fi
            test -s app/google-services.json
          else
            echo "Firebase غير متبنّى — تخطٍّ"
          fi

      - name: Unit tests (بوابة إلزامية)
        if: ${{ inputs.run_tests != false }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace --build-cache

      - name: Lint (تقرير تحذيري لا يكسر)
        if: ${{ inputs.run_tests != false }}
        run: ./gradlew :app:lintDebug --build-cache || true

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --build-cache

      - name: Upload CI artifacts (APK + تقارير lint/tests)
        uses: actions/upload-artifact@v4
        with:
          name: CI-artifacts
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-*.html
            app/build/reports/tests/testDebugUnitTest/**
          retention-days: 7
          if-no-files-found: ignore

  # ═══════════════════════ Release (main / وسوم / يدوي) ═══════════════════════
  release:
    name: Release · notes · semver · store-lint · Telegram · Pages · Play
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (كامل التاريخ والوسوم لحساب semver والملاحظات)
        uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Restore Gradle Wrapper jar if missing
        run: |
          set -e
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sSL -o /tmp/gradle-dist.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
            unzip -q /tmp/gradle-dist.zip -d /tmp
            /tmp/gradle-8.11.1/bin/gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon
          fi
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: google-services.json — اختياري
        env:
          GSC: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if grep -q "com.google.gms.google-services" app/build.gradle.kts; then
            if [ -n "$GSC" ]; then
              case "$GSC" in
                '{'*) printf '%s' "$GSC" > app/google-services.json ;;
                *)    printf '%s' "$GSC" | base64 -d > app/google-services.json ;;
              esac
            elif [ -f app/google-services.json ] && grep -q "project_number" app/google-services.json && ! grep -q "REPLACE_WITH" app/google-services.json; then
              echo "استخدم app/google-services.json المودع"
            else
              echo "::error::المشروع تبنّى Firebase ولا يوجد google-services صالح"; exit 1
            fi
            test -s app/google-services.json
          else
            echo "Firebase غير متبنّى — تخطٍّ"
          fi

      - name: Prepare Signing Keystore (اختياري — وإلا توقيع debug)
        id: signing
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/keystore/app.keystore"
            { echo "RELEASE_STORE_FILE=$RUNNER_TEMP/keystore/app.keystore"
              echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD || 'android' }}"
              echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS || 'androiddebugkey' }}"
              echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'android' }}"
            } >> "$GITHUB_ENV"
            cp "$RUNNER_TEMP/keystore/app.keystore" debug.keystore
            echo "enabled=true"  >> "$GITHUB_OUTPUT"
            echo "signing=signed" >> "$GITHUB_OUTPUT"
          elif [ -f debug.keystore ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "signing=debug" >> "$GITHUB_OUTPUT"
          else
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "signing=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests (بوابة إلزامية قبل أي نشر)
        if: ${{ inputs.run_tests != false }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace --build-cache

      - name: Compute semver + categorized changelog من الـ commits
        id: notes
        run: |
          set -euo pipefail
          # آخر وسم إصدار (يقبل v1.2.3 و v1.2.3-build.9)
          LAST=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-build\.[0-9]+)?$' | sort -V | tail -n1 || true)
          if [ -n "$LAST" ]; then
            BASE=$(echo "$LAST" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/'); RANGE="$LAST..HEAD"
          else
            BASE="0.1.0"; RANGE="$(git rev-list --max-parents=0 HEAD | tail -1)..HEAD"
          fi
          MA=$(echo "$BASE" | cut -d. -f1); MI=$(echo "$BASE" | cut -d. -f2); PA=$(echo "$BASE" | cut -d. -f3)
          SUBJ=$(git log --pretty=%s "$RANGE" || true)
          # قاعدة الرفع: أي feat → minor++ وpatch=0 ؛ وإلا patch++
          if echo "$SUBJ" | grep -q '^feat'; then MI=$((MI+1)); PA=0; else PA=$((PA+1)); fi
          VERSION="$MA.$MI.$PA"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          bullets() { grep -E "$1" | sed -E "$2" | sed 's/^/- /' || true; }
          ADDED=$(echo "$SUBJ"    | bullets '^feat'                 's/^feat[^:]*: *//')
          FIXED=$(echo "$SUBJ"    | bullets '^fix'                  's/^fix[^:]*: *//')
          CHANGED=$(echo "$SUBJ"  | bullets '^(refactor|perf|style)' 's/^[a-z]+[^:]*: *//')
          INTERNAL=$(echo "$SUBJ" | bullets '^(ci|chore|build|docs)' 's/^[a-z]+[^:]*: *//')
          {
            echo "## ✨ أُضيف";    [ -n "$ADDED" ]    && echo "$ADDED"    || echo "- لا إضافات مسجلة"; echo
            echo "## 🐛 أُصلح";    [ -n "$FIXED" ]    && echo "$FIXED"    || echo "- لا إصلاحات مسجلة"; echo
            echo "## 🛠 تغيّر";    [ -n "$CHANGED" ]  && echo "$CHANGED"  || echo "- لا تغييرات مسجلة"; echo
            echo "## ⚙️ داخلي";    [ -n "$INTERNAL" ] && echo "$INTERNAL" || echo "- صيانة دورية"
          } > /tmp/notes_body.md
          { echo ""; echo "📦 يشمل: Debug APK + Release APK + AAB · توقيع: ${{ steps.signing.outputs.signing }}"; } >> /tmp/notes_body.md
          echo "---- الملاحظات ----"; cat /tmp/notes_body.md

      - name: Stamp computed version into build.gradle.kts
        run: |
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${{ steps.notes.outputs.version }}\"/" app/build.gradle.kts
          grep -n "versionName" app/build.gradle.kts

      - name: Build Debug + Release + AAB
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace --build-cache

      - name: Collect dist + SHA256 + sizes
        id: collect
        run: |
          set -euo pipefail
          VERSION="${{ steps.notes.outputs.version }}"; mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APP_NAME}-v${VERSION}-debug.apk"
          R=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)
          [ -n "$R" ] && cp "$R" "dist/${APP_NAME}-v${VERSION}-release.apk"
          A=$(ls app/build/outputs/bundle/release/*.aab 2>/dev/null | head -1 || true)
          [ -n "$A" ] && cp "$A" "dist/${APP_NAME}-v${VERSION}-release.aab"
          {
            echo ""; echo "## 🔐 بصمات SHA256 وأحجام"
            echo '```'
            (cd dist && sha256sum * && du -h *)
            echo '```'
          } >> /tmp/notes_body.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Upload mapping.txt (لفك تعميه R8 عند تحليل الأعطال)
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: APKs-and-Bundle
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Store-lint (فحص جاهزية المتجر — تحذيري إلا عند طلب نشر Play)
        id: storelint
        run: |
          set -e
          FAIL=0
          warn() { echo "::warning::$1"; }
          # أوصاف
          if [ -f store/short_description.txt ]; then
            L=$(tr -d '\n' < store/short_description.txt | wc -m)
            [ "$L" -le 80 ] || { warn "short_description أطول من 80 حرفاً ($L)"; [ "${{ inputs.publish_play }}" = "true" ] && FAIL=1; }
          else warn "store/short_description.txt غير موجود"; fi
          if [ -f store/full_description.md ]; then
            L=$(wc -m < store/full_description.md)
            [ "$L" -le 4000 ] || { warn "full_description أطول من 4000 حرف ($L)"; [ "${{ inputs.publish_play }}" = "true" ] && FAIL=1; }
          else warn "store/full_description.md غير موجود"; fi
          # خصوصية
          [ -f store/privacy_policy.md ] || warn "store/privacy_policy.md غير موجود (لازم لرابط الخصوصية في Play)"
          # لقطات
          N=$(ls store/screenshots/*.png 2>/dev/null | wc -l)
          [ "$N" -ge 2 ] || warn "لقطات المتجر أقل من 2 (الموجود $N) — يلزم لقطتان حقيقيتان من جهاز"
          # feature graphic
          [ -f store/feature_graphic.png ] || warn "store/feature_graphic.png غير موجود (1024x500)"
          # أيقونات الكثافات: إن وُجد adaptive فقط حذّر
          if ls app/src/main/res/mipmap-*/ic_launcher.png >/dev/null 2>&1; then
            echo "أيقونات PNG موجودة لكل الكثافات ✓"
          else
            warn "أيقونات adaptive فقط — أضف set كامل mdpi→xxxhdpi لأجهزة أقدم من Android 8"
          fi
          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"
          [ "$FAIL" = "0" ] || exit 1

      - name: Publish GitHub Release (+ ملاحظات + بصمات)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.collect.outputs.version }}"; RUN="${{ github.run_number }}"
          TAG="v${VERSION}-build.${RUN}"
          { echo "# 🚀 ${APP_NAME} v${VERSION} (Build #${RUN})"; echo ""; cat /tmp/notes_body.md; } > release_notes.md
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "${APP_NAME} v${VERSION} (Build #${RUN})" \
            --notes-file release_notes.md --latest

      - name: Build Pages site (خصوصية + وصف قابل للنشر برابط ثابت)
        if: ${{ inputs.deploy_pages != false && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        run: |
          set -e
          mkdir -p _site
          { echo "<!doctype html><html lang=ar dir=rtl><meta charset=utf-8><title>${APP_NAME} — الخصوصية</title>"
            echo "<body style='font-family:system-ui;max-width:720px;margin:40px auto;line-height:1.8'>"
            echo "<h1>سياسة الخصوصية — ${APP_NAME}</h1>"
            sed 's/$/<br>/' store/privacy_policy.md 2>/dev/null || echo "<p>أضف store/privacy_policy.md</p>"
            echo "<h2>وصف التطبيق</h2>"
            sed 's/$/<br>/' store/full_description.md 2>/dev/null || true
            echo "</body></html>"
          } > _site/index.html

      - name: Upload Pages artifact
        if: ${{ inputs.deploy_pages != false && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        uses: actions/upload-pages-artifact@v3
        with: { path: _site }

      - name: Deploy Pages
        if: ${{ inputs.deploy_pages != false && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send to Telegram (رسالة + 3 ملفات)
        if: ${{ inputs.send_telegram != false }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID غير مضبوطين — تخطٍّ"; exit 0
          fi
          API="https://api.telegram.org/bot$TG_TOKEN"
          VERSION="${{ steps.collect.outputs.version }}"; RUN="${{ github.run_number }}"
          { printf '%s\n' "🚀 ${APP_NAME} v${VERSION} (Build #${RUN}) — الجديد:"; printf '%s\n' ""; cat /tmp/notes_body.md; } > /tmp/tg.txt
          echo "--- sendMessage ---"
          curl -sS -X POST "$API/sendMessage" -d "chat_id=$TG_CHAT" --data-urlencode "text@/tmp/tg.txt" || true
          echo
          for f in dist/*debug.apk dist/*release.apk dist/*release.aab; do
            [ -f "$f" ] || continue
            echo "--- sendDocument: $f ---"
            curl -sS -X POST "$API/sendDocument" -F "chat_id=$TG_CHAT" -F "document=@$f" \
              -F "caption=🚀 ${APP_NAME} v${VERSION} (Build #${RUN})" || true
            echo
          done

      - name: Publish to Google Play (internal track) — اختياري
        if: ${{ inputs.publish_play == true }}
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -e
          if [ -z "$PLAY_JSON" ]; then echo "::warning::PLAY_SERVICE_ACCOUNT_JSON غير مضبوط — تخطٍّ"; exit 0; fi
          printf '%s' "$PLAY_JSON" > /tmp/play.json
          echo "استخدم r0adkll/upload-google-play أو fastlane supply بالأمر:"
          echo "  supply --aab dist/*.aab --track internal --json_key /tmp/play.json"
          # التنفيذ الفعلي (فعّل بعد التأكد من إعداد حساب الخدمة في Play Console):
          # راجع docs/SECRETS.md لخطوات التفعيل الكاملة

      - name: Job Summary (جدول الحالة)
        if: always()
        run: |
          {
            echo "## ✅ ${APP_NAME} v${{ steps.collect.outputs.version || '?' }} (Build #${{ github.run_number }})"
            echo "| البند | الحالة |"
            echo "|---|---|"
            echo "| الاختبارات | ${{ inputs.run_tests == false && 'متخطاة' || 'منفذة' }} |"
            echo "| توقيع | ${{ steps.signing.outputs.signing || '?' }} |"
            echo "| Store-lint | ${{ steps.storelint.outputs.fail == '0' && 'سليم/تحذيرات' || 'تحذيرات' }} |"
            echo "| Pages | ${{ steps.deployment.outputs.page_url || 'غير منشور' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════ bitrot أسبوعي (اكتشاف تقادم main مبكراً) ═══════════════════
  weekly-bitrot:
    name: Weekly bitrot build
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
      - name: Restore Gradle Wrapper jar if missing
        run: |
          set -e
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sSL -o /tmp/gradle-dist.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
            unzip -q /tmp/gradle-dist.zip -d /tmp
            /tmp/gradle-8.11.1/bin/gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon
          fi
          test -f gradle/wrapper/gradle-wrapper.jar
      - uses: gradle/actions/setup-gradle@v4
      - name: Build + tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --build-cache
